[workspace]
resolver = "2"
members = [
  "crates/mm-core",
  "crates/mm-render",
  "crates/mm-plugin-runtime",
  "crates/mm-cli",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/isksss/make-movie"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
fontdb = "0.23"
image = "0.25"
ab_glyph = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
toml = "0.8"
which = "7"
pollster = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"
roxmltree = "0.20"
skia-safe = "0.97.2"
tar = "0.4"
wgpu = "25"
wasmtime = { version = "45", features = ["component-model"] }
wasmtime-wasi = "45"
wat = "1.251.0"
