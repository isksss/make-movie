name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  gui:
    name: GUI
    runs-on: ubuntu-latest
    if: ${{ hashFiles('apps/mm-gui/package.json') != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mm-gui/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir apps/mm-gui install --frozen-lockfile

      - name: Lint
        run: pnpm --dir apps/mm-gui lint

      - name: Test
        run: pnpm --dir apps/mm-gui test

      - name: Build
        run: pnpm --dir apps/mm-gui build
