name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libfontconfig-dev libfreetype-dev

      - name: Check format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  gui:
    name: GUI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xvfb

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.24.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mm-gui/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir apps/mm-gui install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --dir apps/mm-gui exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm --dir apps/mm-gui lint

      - name: Test
        run: pnpm --dir apps/mm-gui test

      - name: E2E
        run: pnpm --dir apps/mm-gui e2e

      - name: Build
        run: pnpm --dir apps/mm-gui build

      - name: Prepare Tauri sidecars
        run: bash scripts/prepare-tauri-sidecars.sh

      - name: Test Tauri backend
        run: cargo test --manifest-path apps/mm-gui/src-tauri/Cargo.toml

      - name: Check Tauri backend
        run: cargo check --manifest-path apps/mm-gui/src-tauri/Cargo.toml

      - name: Tauri E2E
        run: xvfb-run -a pnpm --dir apps/mm-gui e2e:tauri

  plugin-sdk-release:
    name: Plugin SDK Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.24.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Verify SDK release packages
        run: bash plugin-api/sdk/verify-release.sh
