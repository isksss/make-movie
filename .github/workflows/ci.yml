name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Check format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  gui:
    name: GUI
    runs-on: ubuntu-latest
    if: ${{ hashFiles('apps/mm-gui/package.json') != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mm-gui/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir apps/mm-gui install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --dir apps/mm-gui exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm --dir apps/mm-gui lint

      - name: Test
        run: pnpm --dir apps/mm-gui test

      - name: E2E
        run: pnpm --dir apps/mm-gui e2e

      - name: Build
        run: pnpm --dir apps/mm-gui build

      - name: Check Tauri backend
        run: cargo check --manifest-path apps/mm-gui/src-tauri/Cargo.toml
