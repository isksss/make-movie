name: ドキュメント
description: ドキュメント追加・修正チケット
title: "[Docs]: "
labels: []
body:
  - type: textarea
    id: goal
    attributes:
      label: 目的
      description: 追加・修正するドキュメントの目的を書いてください。
    validations:
      required: true
  - type: textarea
    id: target
    attributes:
      label: 対象ドキュメント
      description: 対象ドキュメントや配置先を書いてください。
      value: |
        -
        -
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: 要件
      description: ドキュメントに含める内容を箇条書きで書いてください。
      value: |
        -
        -
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 受け入れ条件
      description: 完了判定に使う条件を書いてください。
      value: |
        -
        -
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: 確認手順
      description: 表示確認やリンク確認などを書いてください。
      value: |
        - [ ] リンク切れがない
        - [ ] 記載コマンドが現在の実装と一致している
    validations:
      required: true
