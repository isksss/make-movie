name: 不具合
description: 不具合修正チケット
title: "[Bug]: "
labels: []
body:
  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: 起きている問題を簡潔に書いてください。
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の挙動
      description: 実際の挙動を書いてください。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する挙動
      description: 期待する挙動を書いてください。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 再現手順
      description: 再現手順を書いてください。
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: 確認手順
      description: 修正確認に使うコマンドや確認手順を書いてください。
      value: |
        - [ ] cargo test
        - [ ] GUI確認
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 参考情報
      description: 関連するログ、スクリーンショット、ファイルパス、PR、Issueを書いてください。
    validations:
      required: false
