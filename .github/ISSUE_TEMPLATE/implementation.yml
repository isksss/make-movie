name: 実装チケット
description: 1 Issue = 1 Task の実装作業チケット
title: "[Task]: "
labels: []
body:
  - type: input
    id: title
    attributes:
      label: タイトル
      description: Issueの目的が分かる短いタイトルを書いてください。
      placeholder: "例: Projectモデルを追加する"
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 目的
      description: このIssueで達成する目的を1つだけ書いてください。
      value: |
        -
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: 要件
      description: 実装で満たす必要がある要件を箇条書きで書いてください。
      value: |
        -
        -
        -
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 受け入れ条件
      description: 完了判定に使う条件を書いてください。
      value: |
        -
        -
        -
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: 確認手順
      description: 実行する検証コマンドや確認手順を書いてください。
      value: |
        - [ ] cargo fmt --check --all
        - [ ] cargo test --workspace
        - [ ] corepack pnpm --dir apps/mm-gui test
        - [ ] corepack pnpm --dir apps/mm-gui e2e
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 参考情報
      description: 関連する仕様、docs、PR、Issue、ファイルパスを書いてください。
      placeholder: |
        - docs/...
        - plugin-api/plugin.wit
    validations:
      required: false
